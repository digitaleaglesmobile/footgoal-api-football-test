name: Fetch All Leagues Players

on:
  workflow_dispatch: {} # click "Run workflow" in the Actions tab to trigger

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run squads fetch (all leagues)
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node squads-fetch-all-leagues.js

      - name: Upload result as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: squads-all-leagues
          path: squads-all-leagues.json
