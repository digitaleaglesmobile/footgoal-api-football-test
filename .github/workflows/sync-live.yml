name: Sync Live Matches (1-min pinged)

# This workflow has NO schedule: block. GitHub's own `schedule:` trigger
# cannot reliably run below 5 minutes, so 1-minute cadence comes from an
# EXTERNAL pinger (e.g. cron-job.org) calling GitHub's REST API once a
# minute to fire this workflow_dispatch event. See setup notes below.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = read-only test run (logs what would be written, writes nothing)'
        required: false
        default: 'false'
      now_override:
        description: 'Optional ISO time to replay a past window (testing only)'
        required: false
        default: ''

# Prevents two ticks from overlapping if a run is slow (rate-limited,
# retrying, etc.) - the next minute's trigger will queue/cancel instead of
# running in parallel and risking duplicate/conflicting Webflow writes.
concurrency:
  group: sync-live-${{ inputs.dry_run || 'false' }}
  cancel-in-progress: false

jobs:
  sync-live:
    runs-on: ubuntu-latest
    timeout-minutes: 4  # safety: must not still be running when the next tick fires
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run live-check sync
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          NOW_OVERRIDE: ${{ inputs.now_override }}
        run: node sync-live.js
