name: Inspect UCL League Fields

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Inspect UCL League CMS fields
        run: node inspect-ucl-league-fields.js
        env:
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
