name: Sync Top Scorers (every 4 hours)

on:
  workflow_dispatch: {}   # lets you also trigger it manually anytime
  schedule:
    - cron: '0 */4 * * *'  # every 4 hours, on the hour (UTC)

concurrency:
  group: sync-topscorers
  cancel-in-progress: false

jobs:
  sync-topscorers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run write-topscorers (live mode)
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
          CONFIRM: 'yes'
        run: node write-topscorers.js
