name: Write Top Scorers (preview or live)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to actually write to Webflow. Leave blank for preview only.'
        required: false
        default: ''
jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run write script
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: node write-topscorers.js
