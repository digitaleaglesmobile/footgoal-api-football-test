name: Sync Top Scorers 2026 (every 4 hours)

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 */4 * * *'

concurrency:
  group: sync-topscorers
  cancel-in-progress: false

jobs:
  sync-topscorers:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run safe 2026 top scorers sync
        run: node sync-top-scorers-2026.js
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
          CONFIRM: 'yes'
