name: Squads Fetch (test)

on:
  workflow_dispatch: {} # manual "Run workflow" button only, for now

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run squads fetch
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node squads-fetch.js
      - name: Upload result as artifact
        uses: actions/upload-artifact@v4
        with:
          name: squads-all-teams
          path: squads-all-teams.json
