name: Deploy live-score worker

# Deploys workers/live (Cloudflare Worker "footgoal-live") used by the mobile app for live scores.
on:
  push:
    branches: [main]
    paths: ['workers/live/**', '.github/workflows/deploy-live-worker.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy
        working-directory: workers/live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          # Create the D1 database on first deploy, then point wrangler.toml at it.
          ID=$(npx --yes wrangler@4 d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const db=JSON.parse(s).find(d=>d.name==='footgoal-push');console.log(db?db.uuid:'')})")
          if [ -z "$ID" ]; then
            npx --yes wrangler@4 d1 create footgoal-push
            ID=$(npx --yes wrangler@4 d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{console.log(JSON.parse(s).find(d=>d.name==='footgoal-push').uuid)})")
          fi
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
          npx --yes wrangler@4 d1 execute footgoal-push --remote --file schema.sql --yes
          npx --yes wrangler@4 deploy
          echo "$API_FOOTBALL_KEY" | npx --yes wrangler@4 secret put API_FOOTBALL_KEY
          echo "## Live worker deployed" >> "$GITHUB_STEP_SUMMARY"
